# PHY --------------------------------------------------------------------------
vendor: xilinx
toolchain: vivado
device: xcku5p-ffvb676-2-i
phy: LiteEthUSPHYRGMII

phy_hw_init_reset: False
# delays of 2ns are active on RTL8211F
phy_rx_delay: 0
phy_tx_delay: 0

# IOdelay clock freq 300MHz
iodelay_clk_freq: 300e6   
# Ultrascale plus
usp: True

# Core -------------------------------------------------------------------------
clk_freq: 2e+8
core: udp
mac_address: 0x10e2d5000016
ip_address: 192.168.1.16
data_width: 8

# UDP --------------------------------------------------------------------------
udp_ports:
  udp0:
    with_broadcast: False
    udp_port: 2000
    data_width: 8
    tx_fifo_depth: 16
    rx_fifo_depth: 16
    mode: "streamer"

  udp1:
    with_broadcast: False
    udp_port: 2001
    data_width: 8
    tx_fifo_depth: 16
    rx_fifo_depth: 16
    mode: "streamer"
